    <script>
      const usernameDesktop = document.getElementById("navbar-username");
      const usernameMobile = document.getElementById("navbar-username-mobile");
      const savedName = localStorage.getItem("displayName");

      if (savedName) {
        if(usernameDesktop) usernameDesktop.textContent = savedName;
        if(usernameMobile) usernameMobile.textContent = savedName;
      }

      firebase.auth().onAuthStateChanged(user => {
        if (user) {
          const name = user.displayName || user.email || "Usuario";
          if(usernameDesktop) usernameDesktop.textContent = name;
          if(usernameMobile) usernameMobile.textContent = name;
          localStorage.setItem("displayName", name);
        }
      });
    </script>

    <script>
        const toggleBtn = document.querySelector('.toggle_btn')

        toggleBtn.onclick = function () {
          dropDownMenu.classList.toggle('open')
          const isOpen = dropDownMenu.classList.contains('open')

          toggleBtnIcon.classList = isOpen
            ? 'fa-solid fa-xmark'
            : 'fa-solid fa-bars'

    <!-- SCRIPTS -->
    <script>
      window.addEventListener('scroll', function() {
        const header = document.querySelector('header');
        if (window.scrollY > 50) {
          header.classList.add('scrolled');
        } else {
          header.classList.remove('scrolled');
        }
      });
    </script>

    <script>
        // Efecto de exposición para botones negros y demás elementos interactivos
        document.addEventListener('DOMContentLoaded', () => {
          document.addEventListener('mousemove', (e) => {
            const buttons = document.querySelectorAll('.btn_desings, #btnEnviarPedido, .Chatgpt-btn-negro, #popuppedidos-button, #descargaspopup-button, .btn_comprar, .btn_videos, .btn_download, #btnCosto, .switch-btn, .cuenta-btn_desings, .cuenta-btn_videos, #alertBtn');
            buttons.forEach(btn => {
              const rect = btn.getBoundingClientRect();
              const x = e.clientX - rect.left;
              const y = e.clientY - rect.top;
              btn.style.setProperty('--x', `${x}px`);
              btn.style.setProperty('--y', `${y}px`);
            });
          });
        });
    </script>
