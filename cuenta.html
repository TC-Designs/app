<script>
(function() {
  const originalAlert = window.alert;

  window.alert = function(message) {
    // Aquí defines el título fijo
    const title = "TC Designs";

    document.querySelector(".alert-title").textContent = title;
    document.querySelector(".alert-message").textContent = message;
    document.getElementById("customAlert").style.display = "block";

    document.getElementById("alertBtn").onclick = function() {
      document.getElementById("customAlert").style.display = "none";
    }
  };
})();
</script>

  <!-- LÓGICA DE CUENTA -->
  <script>
    const auth = firebase.auth();

    auth.onAuthStateChanged(user => {
      if (user) {
        document.getElementById("user-email").value = user.email;
        document.getElementById("display-name").value = user.displayName || "";

        if (user.photoURL) {
          document.getElementById("profile-pic").src = user.photoURL;
        }

        document.getElementById("update-profile").addEventListener("click", () => {
          const newName = document.getElementById("display-name").value;
          user.updateProfile({ displayName: newName }).then(() => {
            alert("Nombre actualizado");
          });
        });
      } else {
        window.location.href = "index.html";
      }
    });
  </script>
  <script>
    function togglePassword() {
        const passwordInput = document.getElementById("user-password");
        const toggleBtn = document.querySelector(".cuenta-mostrar-btn");
        
        if (passwordInput.type === "password") {
        passwordInput.type = "text";
        toggleBtn.textContent = "Ocultar";
        } else {
        passwordInput.type = "password";
        toggleBtn.textContent = "Mostrar";
        }
    }
    </script>
    <script>
      document.getElementById("logout-btn").addEventListener("click", function () {
        firebase.auth().signOut().then(() => {
          localStorage.removeItem("displayName"); // 🔴 Borrar el nombre guardado
          window.location.href = "index.html";    // o donde sea que redirijas
          // Redirige al registro después de cerrar sesión
          window.location.href = "registro.html";
        }).catch((error) => {
          console.error("Error al cerrar sesión:", error);
        });
      });
    </script>
    <script>
    // Efecto de exposición para botones negros
    document.addEventListener('DOMContentLoaded', () => {
      document.addEventListener('mousemove', (e) => {
        // Se añadieron las clases de los botones liquid glass a la selección
        const buttons = document.querySelectorAll('.btn_desings, #btnEnviarPedido, .Chatgpt-btn-negro, #popuppedidos-button, #descargaspopup-button, .btn_comprar, .btn_videos, .btn_download, #btnCosto, .switch-btn, .cuenta-btn_desings, .cuenta-btn_videos, #alertBtn');
        buttons.forEach(btn => {
          const rect = btn.getBoundingClientRect();
          const x = e.clientX - rect.left;
          const y = e.clientY - rect.top;
          btn.style.setProperty('--x', `${x}px`);
          btn.style.setProperty('--y', `${y}px`);
        });
      });
    });
  </script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // Seleccionamos todos los botones que tienen el efecto Liquid Glass
      const liquidButtons = document.querySelectorAll('.cuenta-guardar-btn, .cuenta-guardar-btn1, .cuenta-mostrar-btn, #alertBtn');

      liquidButtons.forEach(btn => {
        btn.addEventListener('mousemove', (e) => {
          // Obtenemos la posición del botón respecto a la pantalla
          const rect = btn.getBoundingClientRect();
          // Calculamos la posición del mouse dentro del botón
          const x = e.clientX - rect.left;
          const y = e.clientY - rect.top;
          
          // Asignamos las coordenadas a las variables de CSS
          btn.style.setProperty('--x', x + 'px');
          btn.style.setProperty('--y', y + 'px');
        });
      });
    });
  </script>
